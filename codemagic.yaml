workflows:
  gatbi-vendor-ios:
    name: GatBi Vendor iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: ios

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gatbi.gatbivender

    scripts:
      - name: Clean Project
        script: |
          set -e
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod install
          cd ..

      - name: Set Up iOS Code Signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Build iOS Release IPA via Flutter
        script: |
          set -e
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist || flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
