workflows:
  gatbi-vendor-ios:
    name: GatBi Vendor iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: ios

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gatbi.gatbivender

    scripts:
      - name: Clean iOS Pods
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          rm -rf .symlinks
          cd ..
          flutter clean

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Precache iOS dependencies
        script: |
          flutter precache --ios

      - name: Install iOS CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles
      - name: Fix Pods Path in pbxproj
        script: |
          cd ios
          # Agar PODS_ROOT pehle se hai toh usay update karein, warna add karein
          if grep -q "PODS_ROOT" Runner.xcodeproj/project.pbxproj; then
            sed -i '' 's|PODS_ROOT = .*|PODS_ROOT = "${SRCROOT}/Pods";|g' Runner.xcodeproj/project.pbxproj
          else
            sed -i '' 's|buildSettings = {|buildSettings = {\n\t\t\t\tPODS_ROOT = "${SRCROOT}/Pods";|g' Runner.xcodeproj/project.pbxproj
          fi
          if grep -q "PODS_PODFILE_DIR_PATH" Runner.xcodeproj/project.pbxproj; then
            sed -i '' 's|PODS_PODFILE_DIR_PATH = .*|PODS_PODFILE_DIR_PATH = "${SRCROOT}/.";|g' Runner.xcodeproj/project.pbxproj
          else
            sed -i '' 's|buildSettings = {|buildSettings = {\n\t\t\t\tPODS_PODFILE_DIR_PATH = "${SRCROOT}/.";|g' Runner.xcodeproj/project.pbxproj
          fi
          cd ..
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
