workflows:
  gatbi-vendor-ios:
    name: GatBi Vendor iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: ios

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gatbi.gatbivender

    scripts:
      # STEP 1: Clean build artifacts
      - name: Clean Flutter Build
        script: |
          set -e
          echo "Cleaning Flutter and iOS build artifacts..."
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/.symlinks

      # STEP 2: Fetch Flutter packages
      - name: Get Flutter Packages
        script: |
          set -e
          flutter pub get
          echo "Flutter dependencies installed successfully."

      # STEP 3: Install CocoaPods dependencies using Flutter's built-in command
      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod install --repo-update
          cd ..
          echo "CocoaPods installed successfully."

      # STEP 4: Set Up iOS Code Signing
      - name: Set Up iOS Code Signing
        script: |
          set -e
          xcode-project use-profiles
          echo "Apple code signing configured."

      # STEP 5: Build iOS IPA using Codemagic CLI
      - name: Build iOS IPA
        script: |
          set -e
          echo "Starting iOS IPA build..."
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            --scheme Runner
          echo "iOS IPA built successfully."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
