workflows:
  gatbi-vendor-ios:
    name: GatBi Vendor iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: ios

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gatbi.gatbivender

    scripts:
      - name: Clean Project
        script: |
          set -e
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          find . -name "Podfile.lock" -delete
          cd ios
          pod install --repo-update
          cd ..
          # Ensure Podfile.lock is copied/accessible at root if needed
          if [ -f ios/Podfile.lock ]; then
            cp ios/Podfile.lock ./Podfile.lock
          fi

      - name: Set Up iOS Code Signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            --scheme "Runner"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
