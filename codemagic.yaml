workflows:
  gatbi-vendor-ios:
    name: GatBi Vendor iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: ios

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gatbi.gatbivender

    scripts:
      - name: Clean & Get Dependencies
        script: |
          set -e
          flutter clean
          flutter pub get

      - name: Reinstall CocoaPods
        script: |
          set -e
          cd ios
          rm -rf Pods Podfile.lock
          pod deintegrate || true
          pod install --repo-update

      - name: Set Up iOS Code Signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -e
          # 1. Create Archive with proper Pod paths
          xcodebuild -workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            -scheme "Runner" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/Runner.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$CM_DEVELOPMENT_TEAM" \
            PODS_PODFILE_DIR_PATH="$CM_BUILD_DIR/ios" \
            PODS_ROOT="$CM_BUILD_DIR/ios/Pods"

          # 2. Export Archive to IPA using Codemagic settings
          xcode-project build-ipa \
            --archive-path "$CM_BUILD_DIR/build/ios/xcarchive/Runner.xcarchive"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
