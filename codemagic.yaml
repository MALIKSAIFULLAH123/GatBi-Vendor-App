
workflows:
  gatbi-vendor-ios:
    name: GatBi Vendor iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: ios

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gatbi.gatbivender

    scripts:

      # STEP 1: Clean Flutter and old CocoaPods build files
      - name: Clean Flutter Build
        script: |
          set -e

          echo "===== CLEANING FLUTTER BUILD ====="

          flutter clean

          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

          # Preserve Podfile.lock
          echo "Flutter cleanup completed"

      # STEP 2: Install Flutter dependencies
      - name: Get Flutter Packages
        script: |
          set -e

          echo "===== GETTING FLUTTER PACKAGES ====="

          flutter pub get

          test -f pubspec.lock
          test -f .flutter-plugins-dependencies

          echo "Flutter packages installed"

      # STEP 3: Verify file_picker plugin metadata
      - name: Verify Flutter Plugin Metadata
        script: |
          set -e

          echo "===== CHECKING FLUTTER PLUGINS ====="

          test -f .flutter-plugins-dependencies

          echo "Checking file_picker registration..."

          grep -n -i "file_picker" \
            .flutter-plugins-dependencies

          echo "Checking file_picker_darwin registration..."

          grep -n "file_picker_darwin" \
            .flutter-plugins-dependencies

          echo "Plugin metadata verified"

      # STEP 4: Prepare iOS Flutter environment
      - name: Prepare iOS Dependencies
        script: |
          set -e

          echo "===== PREPARING IOS ENVIRONMENT ====="

          flutter precache --ios

          test -f ios/Podfile

          echo "iOS environment prepared"

      # STEP 5: Install CocoaPods dependencies
      - name: Install iOS CocoaPods
        script: |
          set -e

          echo "===== INSTALLING COCOAPODS ====="

          cd ios

          pod install --repo-update

          cd ..

          echo "===== VERIFYING POD INSTALLATION ====="

          test -d ios/Pods
          test -f ios/Podfile.lock
          test -f ios/Pods/Manifest.lock

          diff ios/Podfile.lock ios/Pods/Manifest.lock

          echo "CocoaPods installation successful"

      # STEP 6: Verify file_picker iOS Pod
      - name: Verify file_picker iOS Pod
        script: |
          set -e

          echo "===== FILE PICKER POD CHECK ====="

          echo "Plugin symlink directory:"

          ls -la ios/.symlinks/plugins/

          echo "Searching for file_picker plugin:"

          find ios/.symlinks/plugins \
            -maxdepth 3 \
            -iname "*file_picker*" \
            -print

          echo "Checking Podfile.lock:"

          grep -in -C 3 "file_picker" ios/Podfile.lock

          echo "Checking CocoaPods support files:"

          find "ios/Pods/Target Support Files" \
            -maxdepth 2 \
            -iname "*file_picker*" \
            -print

          echo "file_picker Pod verification completed"

      # STEP 7: Configure Flutter CocoaPods XCConfig
      - name: Configure Flutter iOS XCConfig
        script: |
          set -e

          echo "===== CONFIGURING FLUTTER XCCONFIG ====="

          python3 <<'PY'
          from pathlib import Path

          flutter_dir = Path("ios/Flutter")

          configs = {
              "Debug.xcconfig": "debug",
              "Release.xcconfig": "release",
          }

          for filename, configuration in configs.items():

              config_file = flutter_dir / filename

              if not config_file.exists():
                  raise SystemExit(f"ERROR: Missing {config_file}")

              include = (
                  '#include? "../Pods/Target Support Files/'
                  f'Pods-Runner/Pods-Runner.{configuration}.xcconfig"'
              )

              lines = [
                  line for line in config_file.read_text().splitlines()
                  if "Pods-Runner." not in line
              ]

              updated = include + "\n" + "\n".join(lines) + "\n"

              config_file.write_text(updated)

              print(f"Configured {filename}")

          profile = flutter_dir / "Profile.xcconfig"

          if profile.exists():

              include = (
                  '#include? "../Pods/Target Support Files/'
                  'Pods-Runner/Pods-Runner.profile.xcconfig"'
              )

              lines = [
                  line for line in profile.read_text().splitlines()
                  if "Pods-Runner." not in line
              ]

              profile.write_text(
                  include + "\n" + "\n".join(lines) + "\n"
              )

              print("Configured Profile.xcconfig")

          print("XCConfig setup completed")
          PY

      # STEP 8: Verify Flutter configuration
      - name: Verify Flutter Configuration
        script: |
          set -e

          echo "===== VERIFYING FLUTTER CONFIGURATION ====="

          test -f ios/Flutter/Generated.xcconfig
          test -f ios/Flutter/Debug.xcconfig
          test -f ios/Flutter/Release.xcconfig

          grep -q "Generated.xcconfig" \
            ios/Flutter/Debug.xcconfig

          grep -q "Generated.xcconfig" \
            ios/Flutter/Release.xcconfig

          echo "Flutter configuration verified"

      # STEP 9: Verify CocoaPods configuration
      - name: Verify CocoaPods Configuration
        script: |
          set -e

          echo "===== VERIFYING COCOAPODS CONFIGURATION ====="

          test -f ios/Podfile
          test -f ios/Podfile.lock
          test -f ios/Pods/Manifest.lock
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -d ios/Runner.xcworkspace

          diff ios/Podfile.lock ios/Pods/Manifest.lock

          test -f "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"

          test -f "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"

          grep -q "Pods-Runner.debug.xcconfig" \
            ios/Flutter/Debug.xcconfig

          grep -q "Pods-Runner.release.xcconfig" \
            ios/Flutter/Release.xcconfig

          echo "CocoaPods configuration verified"

      # STEP 10: Configure Apple code signing
      - name: Set Up iOS Code Signing
        script: |
          set -e

          echo "===== CONFIGURING APPLE SIGNING ====="

          xcode-project use-profiles

          echo "Apple code signing configured"

      # STEP 11: Verify Xcode workspace
      - name: Verify Xcode Workspace
        script: |
          set -e

          echo "===== VERIFYING XCODE WORKSPACE ====="

          xcodebuild \
            -workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            -scheme Runner \
            -showBuildSettings \
            > /tmp/gatbi_build_settings.log

          grep -E \
            'PODS_ROOT =|PODS_PODFILE_DIR_PATH =|PRODUCT_BUNDLE_IDENTIFIER =' \
            /tmp/gatbi_build_settings.log || true

          echo "Xcode workspace verified"

      # STEP 12: Build signed iOS IPA
      - name: Build iOS IPA
        script: |
          set +e

          echo "===== FINAL FILE PICKER CHECK ====="

          grep -n -C 3 "file_picker_darwin" \
            ios/Runner/GeneratedPluginRegistrant.m || true

          echo "===== COCOAPODS FILE PICKER CHECK ====="

          grep -in -C 3 "file_picker" ios/Podfile.lock || true

          echo "===== BUILDING SIGNED IOS IPA ====="

          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            --scheme Runner

          BUILD_STATUS=$?

          echo "===== XCODE ERROR DETAILS ====="

          grep -in -C 5 -E \
            "error:|fatal error:|module not found|No such module" \
            /tmp/xcodebuild_logs/*.log 2>/dev/null || true

          echo "===== BUILD FINISHED ====="

          exit $BUILD_STATUS

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
      - /tmp/gatbi_build_settings.log
