workflows:
  gatbi-vendor-ios:
    name: GatBi Vendor iOS Build & Publish
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: ios

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gatbi.gatbivender

    scripts:
      # STEP 1: Clean build artifacts safely
      - name: Clean Flutter Build
        script: |
          set -e
          echo "Cleaning Flutter and iOS build artifacts..."
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/.symlinks

      # STEP 2: Fetch Flutter packages
      - name: Get Flutter Packages
        script: |
          set -e
          flutter pub get
          echo "Flutter dependencies installed successfully."

      # STEP 3: Install CocoaPods properly inside ios directory
      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          # Ensure old lock file doesn't cause sandbox sync issues
          rm -f Podfile.lock
          pod install
          # Safety check to ensure Podfile.lock exists right where Xcode expects it
          if [ ! -f "Podfile.lock" ]; then
            echo "Error: Podfile.lock was not generated!"
            exit 1
          fi
          cd ..
          echo "CocoaPods installed successfully."

      # STEP 4: Set Up iOS Code Signing
      - name: Set Up iOS Code Signing
        script: |
          set -e
          xcode-project use-profiles
          echo "Apple code signing configured."

      # STEP 5: Build iOS IPA
      - name: Build iOS IPA
        script: |
          set -e
          echo "Starting iOS IPA build..."
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            --scheme Runner
          echo "iOS IPA built successfully."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
