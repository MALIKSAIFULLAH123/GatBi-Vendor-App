workflows:
  gatbi-vendor-ios:
    name: GatBi Vendor iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: ios

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gatbi.gatbivender

    scripts:

      # STEP 1: Clean Flutter build files
      - name: Clean Flutter Build
        script: |
          set -e

          echo "Cleaning Flutter build..."

          flutter clean

          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

          # Preserve Podfile.lock
          echo "Flutter clean completed"

      # STEP 2: Get Flutter dependencies
      - name: Get Flutter Packages
        script: |
          set -e

          flutter pub get

          echo "Flutter dependencies installed"

      # STEP 3: Repair Flutter plugin metadata
      - name: Repair Flutter Plugin Metadata
        script: |
          set -e

          echo "Regenerating Flutter plugin metadata..."

          rm -f .flutter-plugins
          rm -f .flutter-plugins-dependencies

          flutter pub get

          echo "Checking file_picker registration..."

          grep -n "file_picker_darwin" \
            .flutter-plugins-dependencies

          echo "Flutter plugin metadata verified"

      # STEP 4: Prepare Flutter iOS environment
      - name: Prepare iOS Dependencies
        script: |
          set -e

          flutter precache --ios

          test -f ios/Podfile

          echo "Flutter iOS environment prepared"

      # STEP 5: Install CocoaPods
      - name: Install iOS CocoaPods
        script: |
          set -e

          cd ios

          echo "Installing CocoaPods dependencies..."

          pod install --repo-update

          cd ..

          echo "Checking CocoaPods files..."

          test -f ios/Podfile.lock
          test -f ios/Pods/Manifest.lock
          test -d ios/Pods

          echo "Checking lockfile synchronization..."

          diff ios/Podfile.lock ios/Pods/Manifest.lock

          echo "CocoaPods installation successful"

      # STEP 6: Configure Flutter CocoaPods XCConfig
      - name: Configure Flutter iOS XCConfig
        script: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          flutter_dir = Path("ios/Flutter")

          configs = {
              "Debug.xcconfig": "debug",
              "Release.xcconfig": "release",
          }

          for filename, configuration in configs.items():

              config_file = flutter_dir / filename

              if not config_file.exists():
                  raise SystemExit(
                      f"ERROR: Missing {config_file}"
                  )

              include = (
                  '#include? "../Pods/Target Support Files/'
                  f'Pods-Runner/Pods-Runner.{configuration}.xcconfig"'
              )

              content = config_file.read_text()

              # Remove duplicate CocoaPods include lines
              lines = [
                  line for line in content.splitlines()
                  if "Pods-Runner." not in line
              ]

              # Add CocoaPods configuration first
              updated = include + "\n" + "\n".join(lines) + "\n"

              config_file.write_text(updated)

              print(f"Configured {filename}")

          # Profile is optional
          profile = flutter_dir / "Profile.xcconfig"

          if profile.exists():
              include = (
                  '#include? "../Pods/Target Support Files/'
                  'Pods-Runner/Pods-Runner.profile.xcconfig"'
              )

              content = profile.read_text()

              if include not in content:
                  profile.write_text(include + "\n" + content)

              print("Configured Profile.xcconfig")
          else:
              print("Profile.xcconfig not present; skipping")

          print("CocoaPods XCConfig configuration completed")
          PY

      # STEP 7: Verify Flutter configuration
      - name: Verify Flutter Configuration
        script: |
          set -e

          echo "Checking Flutter configuration..."

          test -f ios/Flutter/Generated.xcconfig

          grep -q "Generated.xcconfig" \
            ios/Flutter/Debug.xcconfig

          grep -q "Generated.xcconfig" \
            ios/Flutter/Release.xcconfig

          echo "Generated Flutter configuration verified"

      # STEP 8: Verify CocoaPods configuration
      - name: Verify CocoaPods Configuration
        script: |
          set -e

          echo "Checking iOS project..."

          test -f ios/Podfile
          test -f ios/Podfile.lock
          test -f ios/Pods/Manifest.lock
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -d ios/Runner.xcworkspace

          echo "Checking lockfile synchronization..."

          diff ios/Podfile.lock ios/Pods/Manifest.lock

          echo "Checking CocoaPods configuration..."

          grep -q "Pods-Runner.debug.xcconfig" ios/Flutter/Debug.xcconfig
          grep -q "Pods-Runner.release.xcconfig" ios/Flutter/Release.xcconfig

          echo "Checking file_picker metadata..."

          grep -n "file_picker_darwin" .flutter-plugins-dependencies || true

          echo "Checking file_picker Pod registration..."

          grep -n -i "file_picker" ios/Podfile.lock || true

          echo "Checking installed plugin directory..."

          ls -la ios/.symlinks/plugins/ || true

          echo "Checking CocoaPods support files..."

          test -f "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"
          test -f "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"

          echo "All structural CocoaPods checks passed"

      # STEP 9: Configure Apple code signing
      - name: Set Up iOS Code Signing
        script: |
          set -e

          xcode-project use-profiles

          echo "Apple code signing configured"

      # STEP 10: Verify Xcode workspace
      - name: Verify Xcode Workspace
        script: |
          set -e

          echo "Checking Xcode workspace..."

          xcodebuild \
            -workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            -scheme Runner \
            -showBuildSettings \
            > /tmp/gatbi_build_settings.log

          echo "Xcode workspace verified"

          grep -E \
            'PODS_ROOT =|PODS_PODFILE_DIR_PATH =|PRODUCT_BUNDLE_IDENTIFIER =' \
            /tmp/gatbi_build_settings.log || true

      # STEP 11: Build signed iOS IPA (temporary diagnostic version)
      - name: Build iOS IPA
        script: |
          set +e

          echo "===== FILE PICKER PODSPEC ====="
          ls -la ios/.symlinks/plugins/file_picker_darwin/ios/
          cat ios/.symlinks/plugins/file_picker_darwin/ios/file_picker_darwin.podspec

          echo "===== POD LOCK ENTRIES ====="
          grep -in -C 3 "file_picker" ios/Podfile.lock || true

          echo "===== GENERATED REGISTRANT ====="
          cat ios/Runner/GeneratedPluginRegistrant.m

          echo "===== BUILD IPA ====="
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            --scheme Runner

          BUILD_STATUS=$?

          echo "===== XCODE ERROR DETAILS ====="
          grep -in -C 5 -E "error:|fatal error:|module not found|No such module" \
            /tmp/xcodebuild_logs/*.log 2>/dev/null || true

          echo "===== END BUILD DIAGNOSTICS ====="
          exit $BUILD_STATUS

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
      - /tmp/gatbi_build_settings.log
