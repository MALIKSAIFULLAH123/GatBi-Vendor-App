
name: task_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # API
  dio: ^5.11.0
  pretty_dio_logger: ^1.4.0

  # Riverpod
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  # Routing
  go_router: ^17.5.0

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  # Files / Images
  image_picker: ^1.2.3
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  intl: ^0.20.3
  file_picker: ^13.0.0
  path_provider: ^2.1.6
  http_parser: ^4.1.2

  # WebSocket
  web_socket_channel: ^3.0.3

  # Firebase
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Notifications
  flutter_local_notifications: ^22.3.0

  # Authentication
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10

  # JSON Generation
  json_serializable: ^6.11.1

  # App Icon Generator
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/Vender.png

# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Vender.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  # Optional Adaptive Icon
  # adaptive_icon_background: "#ffffff"
  # adaptive_icon_foreground: "assets/Vender.png"
